<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-emerald" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E4D3B"/>
      <stop offset="55%" stop-color="#143629"/>
      <stop offset="100%" stop-color="#0E1D17"/>
    </linearGradient>
    <linearGradient id="gold-stroke" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A6F38"/>
    </linearGradient>
    <linearGradient id="gold-fill" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6E6BC"/>
      <stop offset="45%" stop-color="#D4B06A"/>
      <stop offset="100%" stop-color="#9E773B"/>
    </linearGradient>
  </defs>

  <!-- Atelier Crest Base (British Racing Emerald & Obsidian) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-emerald)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" stroke="url(#gold-stroke)" stroke-width="1.5" stroke-opacity="0.72"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="10" stroke="url(#gold-stroke)" stroke-width="0.75" stroke-opacity="0.32"/>

  <!-- Top & Bottom Architectural Compass Ticks -->
  <path d="M32 6.5V10.5M32 53.5V57.5M6.5 32H10.5M53.5 32H57.5" stroke="url(#gold-stroke)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Classic Editorial Serif "W" Monogram -->
  <path d="M12.5 19.5H20.8V21.2L18.6 21.6L24.2 39.4L30.3 23.2L28.7 19.5H36.3V21.2L34.4 21.6L39.9 39.4L45.4 21.7L43.2 21.2V19.5H50.5V21.2L48.5 21.7L40.4 46.5H38.1L31.8 27.6L25.2 46.5H22.9L14.6 21.7L12.5 21.2V19.5Z" fill="url(#gold-fill)"/>

  <!-- Subtle Gold Diamond Accent at Crown -->
  <path d="M32 12L34.2 14.2L32 16.4L29.8 14.2L32 12Z" fill="#E5C378"/>
</svg>
