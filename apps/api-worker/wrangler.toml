name = "wonder-api-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "香港小公司行政管理系統 (Cloudflare Serverless)"
ENVIRONMENT = "production"
ACCESS_TOKEN_EXPIRE_MINUTES = "10080"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_VISION_MODEL = "dots-studio/dots-3-note-preview:free"
OPENROUTER_VISION_MODEL_FALLBACK = "nvidia/nemotron-3.5-super-vl:free"
OPENROUTER_VISION_MODEL_LASTRESORT = "inclusionai/ling-3.0-flash-vl"
OPENROUTER_DEEPSEEK_MODEL = "deepseek/deepseek-v4-pro-0813"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-v4-pro"
CORS_ORIGINS = "https://wonderwisdom.online,https://www.wonderwisdom.online,https://company.wonderwisdom.online,https://fis.wonderwisdom.online,http://localhost:3000,http://localhost:5174,http://localhost:5175"

# ── Cloudflare D1 Serverless SQLite 绑定 ──────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "wonder-db"
database_id = "b76be6c3-b0b7-4100-a417-dcbb0a08bf17"

# ── Cloudflare R2 对象存储绑定（收据与佣金月结单归档）──────────
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wonder-platform-files"

# ── Cloudflare Cron Triggers（行情与净值缓存轮转刷新）────────────
# 每轮刷新最久未更新的 6 个组合；工作日每 6 小时一轮，21 个组合当天即可全覆盖。
[triggers]
crons = ["0 */6 * * 1-5"]
