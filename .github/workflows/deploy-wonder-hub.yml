name: Deploy wonder-hub to Cloudflare Pages

# 推送到 main 且只动到 wonder-hub 时才触发，避免无关提交（如 api-worker）浪费构建
on:
  push:
    branches: [main]
    paths:
      - "apps/wonder-hub/**"
  workflow_dispatch:

concurrency:
  group: deploy-wonder-hub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不指定 version：让 action 直接读取仓库 package.json 的 packageManager 字段（pnpm@10.33.0），
      # 避免与 action 的 version 冲突报 ERR_PNPM_BAD_PM_VERSION。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 不用 --frozen-lockfile：避免提交态 lockfile 与 package.json 轻微漂移导致 CI 直接失败
      - name: Install dependencies
        run: pnpm install

      # 关键：NEXT_STATIC_EXPORT=1 让 next build 走静态导出，产物落到 out/
      - name: Build wonder-hub (static export)
        working-directory: apps/wonder-hub
        env:
          NEXT_STATIC_EXPORT: "1"
        run: pnpm run build

      # 诊断步骤：用 CI 的 API Token 跑 whoami，能立刻暴露 token 权限/失效问题
      - name: Verify Cloudflare auth (diagnostic)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/wonder-hub
          command: pages deploy out --project-name wonder-hub
